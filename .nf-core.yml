repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - assets/sendmail_template.txt
  multiqc_config: false
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - assets/multiqc_config.yml

template:
  org: nf-core
  name: mxampseq
  description: Multiplex amplicon sequencing generic workflow
  author: amakunin
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - multiqc
    - fastqc
    - gpu
  is_nfcore: true
